aid: aijia-home-furnishing-products
name: Aijia Home Furnishing Products
description: 'Aijia Home Furnishing Products (艾佳生活, operated by 江苏艾佳家居用品有限公司 /
  Jiangsu Aijia Home Furnishing Products Co., Ltd.) is a Nanjing-based Chinese internet
  home-furnishing and home-improvement platform, founded in 2015 as a joint venture of
  Jiangsu Yide Group and Central China (Jianye) Group. It sells a one-stop packaged fit-out
  for newly delivered apartments — design, hard decoration, soft furnishing, construction,
  acceptance, delivery and after-sales — plus its 全品家 furniture suites, distributed through
  property-developer partnerships across 25 Chinese provinces and 500-plus residential
  projects. It raised a RMB 1 billion Series B led by Tiantu Capital in 2018 at a valuation
  above USD 1 billion and launched Dramatic Reality (DR), an AI design platform, in 2019. Its public surface is a Chinese-language consumer website, a mobile site,
  a consumer app and a login-only merchant console; it publishes no developer portal, no API
  reference and no machine-readable API contract.'
